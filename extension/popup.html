<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video Note Taker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="popup">
  <header class="masthead">
    <img src="icons/icon48.png" alt="" class="logo" />
    <h1 class="wordmark">Video Note Taker</h1>
    <button id="notion-chip" type="button"></button>
  </header>

  <section id="current" class="now" hidden>
    <div class="thumb-wrap"><img id="current-thumb" alt="" /><span id="current-badge" class="badge"></span></div>
    <div class="now-text">
      <p id="current-title" class="now-title"></p>
      <p id="current-meta" class="now-meta">On this tab</p>
    </div>
    <button id="take-notes" class="pill primary" type="button">Take notes</button>
  </section>

  <div id="banner" class="banner" role="alert" hidden></div>

  <main>
    <div class="list-head">
      <h2>Your notes</h2>
      <button id="clear" class="pill tonal small" type="button" hidden>Clear finished</button>
    </div>
    <ol id="jobs" class="jobs" aria-live="polite"></ol>
    <div id="empty" class="empty" hidden>
      <div class="empty-art" id="empty-art"></div>
      <p class="empty-title">No notes yet</p>
      <p class="empty-text">Open a YouTube video up to 20 minutes long and click <b>Take Notes</b> in the player.</p>
    </div>
  </main>

  <footer class="foot">
    <span id="server" class="server"></span>
    <nav class="foot-links">
      <a href="history.html" target="_blank" class="pill ghost small">History</a>
      <a href="options.html" target="_blank" class="pill ghost small">Settings</a>
    </nav>
  </footer>

  <template id="job-tpl">
    <li class="job">
      <div class="job-head">
        <div class="thumb-wrap">
          <img class="thumb" alt="" />
          <div class="resume" hidden><div class="resume-fill"></div></div>
          <span class="badge"></span>
        </div>
        <div class="job-meta">
          <p class="job-title"></p>
          <p class="job-status"></p>
          <p class="detail"></p>
        </div>
      </div>
      <ol class="chapters" aria-label="Progress"></ol>
      <ul class="warnings"></ul>
      <div class="actions"></div>
    </li>
  </template>

  <script type="module" src="popup.js"></script>
</body>
</html>
