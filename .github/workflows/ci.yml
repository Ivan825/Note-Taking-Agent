name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.5
      - run: ruff check .

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests --cov=notes_common --cov=app --cov=worker --cov-report=xml --cov-report=term
      - uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Write CI .env (no real secrets; external APIs are never called)
        run: |
          cat > .env <<EOF
          ANTHROPIC_API_KEY=ci-dummy
          TOKEN_ENC_KEY=$(python -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          ENABLE_DEBUG_ENDPOINTS=true
          MAX_ATTEMPTS=2
          BACKOFF_SECONDS=2
          EOF
      - run: docker compose up -d --build
      - run: ./scripts/wait_healthy.sh
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests/integration
        env:
          INTEGRATION: "1"
      - if: failure()
        run: docker compose logs --tail=200 gateway worker
      - if: always()
        run: docker compose down -v
